<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그림자 도시 5.0</title><style>
:root{font-family:system-ui,sans-serif;color:#edf0ff;background:#101421}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:14px}header{background:linear-gradient(125deg,#25304b,#45233f);padding:22px;border-radius:14px}h1{margin:5px 0;font-size:26px}section{background:#1b2333;border:1px solid #394359;border-radius:12px;padding:13px;margin:12px 0}button,select,input,textarea{font:inherit;background:#273248;color:#fff;border:1px solid #506079;border-radius:8px;padding:9px}button{cursor:pointer}button:disabled{opacity:.45}button.primary{background:#536fe0;border-color:#536fe0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:100px}.muted{color:#abb7d2;font-size:13px}.people{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.person{background:#263147;border-radius:9px;padding:9px;text-align:center}.dead{opacity:.4}.tabs button.active{background:#536fe0}.chat{height:390px;overflow-y:scroll;overscroll-behavior:contain;scrollbar-width:auto;scrollbar-color:#9daedc #263147;display:flex;flex-direction:column;gap:8px;padding:8px;border:1px solid #3a4861;border-radius:8px;touch-action:pan-y}.chat::-webkit-scrollbar{width:13px}.chat::-webkit-scrollbar-thumb{background:#91a1c9;border-radius:8px}.bubble{align-self:flex-start;max-width:88%;padding:9px 11px;background:#2c3951;border-radius:10px;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#3d4e8b}.bubble small{display:block;color:#c6d2ef;margin-bottom:3px}.bubble button{padding:2px 6px;font-size:11px;margin-top:5px}.reply{border-left:2px solid #aab9dd;padding-left:7px;font-size:12px;color:#c5d0e6;margin-bottom:5px}.hidden{display:none!important}.logs{max-height:150px;overflow:auto;line-height:1.7;font-size:13px}#status{min-height:20px;color:#b5c4e8}#jump{position:absolute;right:15px;bottom:13px;background:#637be1}.chatwrap{position:relative}#actionBox select{width:100%;margin:5px 0}#actionBox button{margin-top:7px;width:100%}#messages{scroll-behavior:auto}
</style></head><body><main><header><div class="muted">SHADOW CITY 5.0 · LLM EDITION</div><h1>🌒 그림자 도시</h1><div>대화는 AI가, 승패와 능력은 규칙 엔진이 결정합니다.</div><div id="setup" class="row" style="margin-top:15px"><select id="size"><option value="8">8명</option><option value="10" selected>10명</option><option value="12">12명</option></select><button class="primary" id="start">게임 시작</button></div></header><div id="game" class="hidden"><section><div id="phase"></div><h2 id="role"></h2><div id="desc" class="muted"></div></section><section><b>👥 플레이어</b><div class="people" id="people" style="margin-top:10px"></div></section><div class="row tabs"><button data-tab="chat" class="active">💬 채팅</button><button data-tab="action">⚔️ 행동</button><button data-tab="notes">📓 기록</button></div><section id="chatPanel"><div id="channels" class="row tabs"></div><div class="chatwrap"><div id="messages" class="chat"></div><button id="jump" class="hidden">↓ 최신 메시지</button></div><div id="status"></div><div id="replyPreview" class="muted"></div><div class="row"><input id="input" class="grow" maxlength="500" placeholder="대화를 입력하세요"><button id="send" class="primary">전송</button></div><div class="row" style="margin-top:8px"><button id="autotalk">🗣️ AI 자율 토론</button><button id="autoToggle">⏸ 자동 대화 끄기</button><button id="older">▲ 이전 대화</button><button id="latest">▼ 최신 대화</button><button id="cancelReply">답장 취소</button></div><div class="muted">스크롤바 또는 ▲ 버튼으로 이전 대화를 읽을 수 있습니다. 새 메시지가 와도 읽던 위치를 유지합니다.</div></section><section id="actionPanel" class="hidden"><div id="actionBox"></div></section><section id="notesPanel" class="hidden"><div id="notes"></div></section><section><b>📜 사건 기록</b><div id="logs" class="logs"></div></section></div></main><script>
let S=null,tab='chat',channel='public',reply=null,busy=false,atBottom=true,unread=0,autoTimer=null,gameVersion=0,autoEnabled=true;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(route,data={}){let r=await fetch('/api/'+route,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j}
const me=()=>S.me,available=()=>S.players.filter(p=>p.alive),chatAllowed=()=>S.phase!=='end'&&(channel==='ghost'?!me().alive:channel==='mafia'?me().alive&&me().team==='마피아':me().alive&&S.phase==='day');
function setStatus(t){$('status').textContent=t||''}
function showError(e){setStatus('⚠️ '+e.message)}
function channels(){return ['public',...(me().team==='마피아'?['mafia']:[]),...(!me().alive?['ghost']:[])]}
function messageHTML(m){let source=S.messages.find(x=>x.id===m.replyTo),name=m.author<0?'시스템':S.players[m.author]?.name||'알 수 없음';return `<div class="bubble ${m.author===0?'mine':''}"><small>${esc(name)} · ${m.day}일 차</small>${source?`<div class="reply">↳ ${esc(S.players[source.author]?.name||'시스템')}: ${esc(source.text.slice(0,80))}</div>`:''}<div>${esc(m.text)}</div>${m.author>=0?`<button data-reply="${m.id}">↩ 답장</button>`:''}</div>`}
function drawMessages(force=false){let box=$('messages'),near=force||atBottom||box.scrollHeight-box.scrollTop-box.clientHeight<65,oldTop=box.scrollTop;box.innerHTML=S.messages.filter(m=>m.channel===channel).map(messageHTML).join('');if(near){box.scrollTop=box.scrollHeight;atBottom=true;unread=0}else{box.scrollTop=oldTop;atBottom=false;unread++}updateJump()}
function updateJump(){$('jump').classList.toggle('hidden',atBottom);$('jump').textContent=unread?`↓ 최신 메시지 (${unread})`:'↓ 최신 메시지'}
function render(){if(!S)return;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('phase').textContent=S.phase==='end'?'🏆 게임 종료 · '+S.winner+' 승리':`${S.day}일 차 · ${S.phase==='night'?'🌙 밤':'☀️ 낮'}`;$('role').textContent=`${me().role} (${me().team})${me().alive?'':' · 사망'}`;$('desc').textContent='복사한 능력: '+(me().copies.join(', ')||'없음');$('people').innerHTML=S.players.map(p=>`<div class="person ${p.alive?'':'dead'}"><div style="font-size:23px">${p.alive?'🐱':'💀'}</div><b>${esc(p.name)}</b><div class="muted">${p.alive?'생존':'사망'}</div></div>`).join('');$('logs').innerHTML=S.events.slice().reverse().map(x=>`<div>${esc(x.text)}</div>`).join('');for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===tab);$('chatPanel').classList.toggle('hidden',tab!=='chat');$('actionPanel').classList.toggle('hidden',tab!=='action');$('notesPanel').classList.toggle('hidden',tab!=='notes');if(!channels().includes(channel))channel=!me().alive?'ghost':'public';$('channels').innerHTML=channels().map(c=>`<button data-channel="${c}" class="${c===channel?'active':''}">${{public:'🌐 공개',mafia:'🔪 마피아',ghost:'👻 유령'}[c]}</button>`).join('');$('input').disabled=!chatAllowed()||busy;$('send').disabled=!chatAllowed()||busy;$('autotalk').disabled=!chatAllowed()||busy;drawMessages();drawActions();drawNotes()}
async function refresh(){let next=await api('state');S=next;render()}
async function start(){try{gameVersion++;S=await api('start',{size:Number($('size').value)});tab='chat';channel='public';reply=null;atBottom=true;render();setStatus('게임 시작! 밤 행동을 선택하세요.');}catch(e){showError(e)}}
async function talk(auto=false){if(busy||!chatAllowed())return;let text=$('input').value.trim();if(!auto&&!text)return;const sentReply=reply;busy=true;setStatus(auto?'AI가 자율 토론 중…':'메시지 전송 중…');try{if(!auto){await api('chat',{channel,text,replyTo:reply});$('input').value='';reply=null;$('replyPreview').textContent='';await refresh()}setStatus('AI가 생각하고 입력 중… (실제 모델 호출)');const v=gameVersion;await api(auto?'autotalk':'respond',{channel,replyTo:sentReply});if(v===gameVersion)await refresh();setStatus('')}catch(e){showError(e)}finally{busy=false;if(S)render()}}
function drawActions(){const a=$('actionBox');if(S.phase==='end'){a.innerHTML=`<h2>🏆 ${S.winner} 팀 승리</h2><p>새 게임을 시작하려면 페이지를 새로고침하세요.</p>`;return}if(!me().alive){a.innerHTML='<p>사망 상태입니다. 유령 채팅에 참여하거나 관전하세요.</p><button id="advance">다음 단계 관전</button>';$('advance').onclick=async()=>{try{S=await api('advance');render()}catch(e){showError(e)}};return}if(S.phase==='day'){let other=available().filter(p=>p.id!==0);a.innerHTML='<h3>🗳️ 낮 투표</h3>'+select('vote',other)+'<button id="voteBtn" class="primary">투표 확정</button>'+(me().team==='마피아'&&!S.guessUsed?'<h3>🔪 직업 맞히기</h3>'+select('guessTarget',other)+`<select id="guessRole">${['경찰','사냥꾼','성직자','고양이','기자','마피아','연쇄살인마'].map(r=>`<option>${r}</option>`).join('')}</select><button id="guessBtn">직업 추리 실행</button>`:'');$('voteBtn').onclick=async()=>{try{S=await api('vote',{target:Number($('vote').value)});render()}catch(e){showError(e)}};if($('guessBtn'))$('guessBtn').onclick=async()=>{try{S=await api('guess',{target:Number($('guessTarget').value),role:$('guessRole').value});render()}catch(e){showError(e)}};return}a.innerHTML='<h3>🌙 밤 능력</h3><div class="muted">능력 선택 중…</div>';api('options').then(opts=>{if(S.phase!=='night'||tab!=='action')return;a.innerHTML=`<select id="ability">${opts.map(o=>`<option value="${o.type}">${esc(o.label)}</option>`).join('')}</select><div id="targets"></div><button id="nightBtn" class="primary">행동 확정 · 아침으로</button>`;$('ability').onchange=drawTargets;drawTargets();$('nightBtn').onclick=async()=>{try{let action={type:$('ability').value,target:$('target')?Number($('target').value):null,target2:$('target2')?Number($('target2').value):null};S=await api('night',{action});render()}catch(e){showError(e)}}}).catch(showError)}
function select(id,arr){return `<select id="${id}">${arr.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`}
function drawTargets(){let type=$('ability').value,arr=type==='revive'?S.players.filter(p=>!p.alive):['heal','cat','trap'].includes(type)?available():available().filter(p=>p.id!==0);$('targets').innerHTML=type==='pass'?'':select('target',arr)+(type==='serial'&&me().role==='연쇄살인마'?'<div class="muted">두 번째 대상 (해금 시 적용)</div>'+select('target2',arr):'')}
function drawNotes(){$('notes').innerHTML=`<h3>📓 개인 정보</h3><div>공식 공개: ${S.facts.length?S.facts.map(f=>S.players[f.id].name+' = '+f.role).join(', '):'없음'}</div><div class="muted" style="margin-top:8px">확정된 공식 정보와 일반 채팅 주장은 구분됩니다.</div><h3>투표 기록</h3>${S.votes.map(v=>`<div>${v.day}일 차: ${v.ballots.map(b=>S.players[b.from].name+'→'+S.players[b.to].name).join(' / ')}</div>`).join('')||'아직 투표 없음'}`}
$('start').onclick=start;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('channels').onclick=e=>{let b=e.target.closest('[data-channel]');if(b){channel=b.dataset.channel;reply=null;atBottom=true;render()}};$('messages').onclick=e=>{let b=e.target.closest('[data-reply]');if(b){reply=Number(b.dataset.reply);let m=S.messages.find(x=>x.id===reply);$('replyPreview').textContent=`↩ ${S.players[m.author].name}: ${m.text.slice(0,90)}`;$('input').focus()}};$('messages').onscroll=()=>{let b=$('messages');atBottom=b.scrollHeight-b.scrollTop-b.clientHeight<65;if(atBottom)unread=0;updateJump()};$('jump').onclick=$('latest').onclick=()=>{let b=$('messages');b.scrollTop=b.scrollHeight;atBottom=true;unread=0;updateJump()};$('older').onclick=()=>{$('messages').scrollTop=Math.max(0,$('messages').scrollTop-240);atBottom=false;updateJump()};$('cancelReply').onclick=()=>{reply=null;$('replyPreview').textContent=''};$('send').onclick=()=>talk(false);$('autotalk').onclick=()=>talk(true);$('autoToggle').onclick=()=>{autoEnabled=!autoEnabled;$('autoToggle').textContent=autoEnabled?'⏸ 자동 대화 끄기':'▶ 자동 대화 켜기'};autoTimer=setInterval(()=>{if(autoEnabled&&S&&S.phase==='day'&&tab==='chat'&&channel==='public'&&!busy&&chatAllowed())talk(true)},16000);$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)talk(false)};
</script></body></html>
